# ============================================================================
# BraceSync prod 裸域 HTTPS (443) server 块 —— T723 外置件（候手工放置，不进模板）
#
# 来源：prod 现网 /etc/nginx/nginx.conf（188 行，sha256 bb686f0381070edaac4224ec5194705a
#       9d68c5e6d7aa5b163a8c2189606ea8d5，2026-10-21 14:57 只读取件）第 144-187 行逐字切片。
#       本文件下方那 44 行块体 sha256 前 16 位 = c49b149a41e811a9，与现网该区间 diff 空。
#       现网原件不入库（含内网地址与证书路径），需要时按上述 sha 现场重取比对。
#
# 为什么外置：scripts/deploy/nginx.conf 是 prod 与 staging 共用的同一份模板（部署脚本把
#       它 cp 进 staging 目录当 staging conf 用）。本块引用 /etc/nginx/certs/hbksd.com.cn/
#       证书束，而 staging 侧没有这束证书——块一进模板，下次 staging 部署 nginx 直接起不来。
#       故按 T723 裁定把块落在此文件，模板内只留一条注释锚点指向这里。
#
# 重建须知（三条，缺一即现网静默少一块或静默少一条腿）：
#   1) prod 重建（compose up / 配置回滚 / 换机）不会自动带出本块：必须手工把下面 44 行粘进
#      /etc/nginx/nginx.conf 的 http{} 内——位置在 api.hbksd.com.cn 那个 443 server 块闭合的
#      "    }" 之后、http{} 闭合的 "}" 之前；粘完先 nginx -t，通过再 reload 或重建容器。
#      验证：nginx -T 输出里正则 ^[[:space:]]*server_name hbksd.com.cn; 精确命中 1 处
#            （务必带行首空白锚定——api 两个块写的是 server_name api.hbksd.com.cn，子串会误命中）。
#   2) staging 不放置本块：staging 无该证书束，放置即起不来；staging 对外只走宿主 :81，
#      裸域 443 与它无关。反向判据：staging 现网 conf 里同一正则命中数恒为 0。
#   3) 🔴 重建后必验两条运行判据（nginx -t 只证语法与证书可加载，不证代理腿通）：
#      a) /stg/healthz —— curl -sk https://api.hbksd.com.cn/stg/healthz 出 200。
#         这一步验的是模板里的 /stg/ 反代腿（api 443 → 172.17.0.1:81 → staging gateway）；
#         重建若把模板回退成旧版，/stg/ 腿会静默消失，而 api 面 /healthz 照旧 200，看不出来。
#      b) 裸域 302 —— curl -skI https://hbksd.com.cn/ 出 302 且 Location 指向 /admin/。
#         这一步验的就是本块（本块兜底 location / { return 302 /admin/; }）；
#         证书 CN 不匹配是已知现状（Boss 2026-10-16 裁忽略），故用 -k，只判状态码与 Location。
#
# 依赖：/etc/nginx/certs/hbksd.com.cn/hbksd.com.cn_nginx/ 下 hbksd.com.cn_bundle.crt 与
#       hbksd.com.cn.key 在位（宿主侧 /opt/bracesync/certs/hbksd.com.cn，ro 挂进容器）。
# 批案：Boss 2026-10-16 a 案——裸域服务 prod admin-web，与 https://api.hbksd.com.cn/admin/ 同源同内容；
#       路由照抄 api 块，api 块零改动。
# 取证：2026-10-23 10:28 于 staging 宿主（106.52.39.208，与 prod 同机不同容器）一次性
#       nginx:1.25-alpine 容器三面 nginx -t 全绿 exit=0：对照拍（staging 现役 conf 194 行）、
#       模板拍（origin/main@7f873a9 收编后 220 行）、组装拍（本块 44 行按上述位回填 265 行）。
#       证书用 /tmp 自签合成束 ro 挂入，未读 prod 证书目录一个字节；staging/prod 容器 StartedAt
#       与 staging conf sha256 前后同值，一次性容器存量归零。判据与命令原文见 docs 仓
#       docs/ops/prod-deploy-runbook.md §7.7（V1.2.5）。
# ============================================================================

    # ─── 裸域 HTTPS (443) — hbksd.com.cn（Boss 批 2026-10-16，a 案：服务 prod admin-web，
    #     与 https://api.hbksd.com.cn/admin/ 同源同内容；路由照抄 api 块，api 块零改动）
    server {
        listen 443 ssl;
        http2 on;
        server_name hbksd.com.cn;

        ssl_certificate     /etc/nginx/certs/hbksd.com.cn/hbksd.com.cn_nginx/hbksd.com.cn_bundle.crt;
        ssl_certificate_key /etc/nginx/certs/hbksd.com.cn/hbksd.com.cn_nginx/hbksd.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /assets/ {
            root /usr/share/nginx/html/admin;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location /healthz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        location / {
            return 302 /admin/;
        }
    }
