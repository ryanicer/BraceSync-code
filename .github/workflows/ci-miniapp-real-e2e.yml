# BraceSync MiniApp Real-E2E — PR 门禁（静态语法关卡）
# T054：双端小程序「真实模式」E2E（miniprogram-automator 直驱 staging 真实 API，e2e-miniapp/）。
#
# 为什么只做「静态语法门禁」而不是实跑：
#   miniprogram-automator 必须连接【运行中的微信开发者工具自动化端口】（9420/9422，Boss 侧
#   start-automation.ps1 / CONNECT_ONLY），并依赖 staging 真机授权与实测数据 —— 无法在 CI runner 实跑。
#   真实运行的验收权在 PM/Boss（Boss 侧 devtools 实跑）。因此本 workflow 用 node --check 捕获
#   语法错误（历史教训：漏 import / 未定义符号直接致构建与 CI 失败），作为低成本前置门禁。
#
# 成本优化（对齐 T038/T045）：仅 e2e-miniapp/** 或本 workflow 变更时触发，最小触发集；
#   不执行 npm ci、不启动 dev server、不拉 devtools —— 秒级完成。触发集可与 Andy 复核后收紧。
#
# T318 追加：本 job 末步扫全仓 .ps1/.psm1/.psd1 的编码（无 BOM + 含非 ASCII ⇒ 判红）。
#   node --check 只看 .js，ps1 的内容此前 CI 完全不解析，T313 那类缺陷复发时门禁会全绿。
name: MiniApp Real-E2E Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'e2e-miniapp/**'
      - '.github/workflows/ci-miniapp-real-e2e.yml'

# 成本优化（对齐 T045）：同一 PR/分支并发 push 只保留最新一次，取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  miniapp-syntax:
    name: e2e-miniapp Syntax Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check e2e-miniapp exists
        run: |
          if [ ! -d "e2e-miniapp" ]; then
            echo "::error::e2e-miniapp/ 目录不存在（门禁目标缺失）"
            exit 1
          fi
      - name: node --check all spec/helper JS
        run: |
          set -e
          files=$(find e2e-miniapp -maxdepth 1 -name '*.js' -type f | sort)
          if [ -z "$files" ]; then
            echo "::error::e2e-miniapp/ 下未找到 .js 文件（门禁失效）"
            exit 1
          fi
          echo "共 $(printf '%s\n' "$files" | grep -c .) 个 .js 文件待检查"
          while IFS= read -r f; do
            printf 'checking: %s\n' "$f"
            node --check "$f" || { echo "::error::语法错误 $f"; exit 1; }
          done <<< "$files"
          echo "✓ e2e-miniapp/*.js 语法全部通过（真实模式运行需 Boss 侧 devtools，CI 不实跑）"
      - name: run-real-e2e.ps1 present
        run: |
          test -f e2e-miniapp/run-real-e2e.ps1 && echo "✓ run-real-e2e.ps1（Windows 一键编排）present"
      # T318：PowerShell 脚本编码门禁（防 T313/Alice 缺陷单那类「无 BOM + 含中文」复发）
      - name: PowerShell script encoding gate
        run: |
          set -e
          cat > /tmp/ps1-encoding-gate.cjs <<'JS'
          const { execFileSync } = require('child_process')
          const fs = require('fs')
          const files = execFileSync('git', ['ls-files', '-z', '--', '*.ps1', '*.psm1', '*.psd1'])
            .toString('utf8').split('\0').filter(Boolean).sort()
          const bad = files.filter((f) => {
            const b = fs.readFileSync(f)
            const hasBom = b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF
            return !hasBom && b.some((c) => c > 0x7f)
          })
          for (const f of bad) {
            console.error('::error::' + f + ' 是「UTF-8 无 BOM 且含非 ASCII 字节」—— Windows PowerShell 5.1 按系统 ACP（如 936/GBK）解码无 BOM 脚本，'
              + '中文序列的悬挂前导字节会连紧随其后的 ASCII 引号/花括号一起被吞掉，运行期报 CommandNotFoundException（见 T313 / TAPD bug 1133005753001000001）。'
              + '修法：把文件另存为「UTF-8 with BOM」，或将中文文案改为 ASCII。')
          }
          if (bad.length) process.exit(1)
          console.log('✓ PowerShell 编码门禁通过：' + files.length + ' 个 .ps1/.psm1/.psd1，无「缺 BOM + 含非 ASCII」组合')
          JS
          node /tmp/ps1-encoding-gate.cjs