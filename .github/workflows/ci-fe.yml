# BraceSync CI-FE — PR 门禁（前端侧）+ main push 回归（T604）
# 对齐：docs/ §6.2/§6.3 · docs/ §7
# 成本优化（T038）：仅 apps/ packages/ 或前端依赖/CI 配置变更时触发；纯 docs/ 改动不跑前端检查
# T604：此前只有 pull_request 段，apps/**、packages/** 合并进 main 后 CI-FE 一次都不跑
#   （主干面零回归）。现补 push:branches:[main]，paths 与 PR 面同串；不删、只加。
name: CI-FE

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-fe.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-fe.yml'

# 成本优化（T045）：同一 PR/分支并发 push 只保留最新一次运行，取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  frontend-lint-test:
    name: Frontend Lint + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest with coverage
        run: npm run test -- --coverage --run

  # T144 契约漂移门禁：防止「前端消费的响应字段名」与「契约类型（packages/shared-types）」漂移（参考案例 T143）
  contract-drift-gate:
    name: Contract Drift Gate（契约漂移门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Contract Drift Gate
        run: npm run test:contract-gate

  # T153 mp-weixin 构建关卡：拦截小程序出包构建失败（sass 依赖回归 / scss 编译等）
  mp-weixin-build:
    name: mp-weixin Build Gate（小程序构建门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [patient-miniapp, tech-miniapp]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build mp-weixin (${{ matrix.app }})
        run: npm -w apps/${{ matrix.app }} run build:mp-weixin
      - name: Verify build artifacts
        run: |
          DIST_DIR="apps/${{ matrix.app }}/dist/build/mp-weixin"
          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Build output directory $DIST_DIR not found"
            exit 1
          fi
          CONFIG_FILE="$DIST_DIR/project.config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::project.config.json not found in $DIST_DIR"
            exit 1
          fi
          python3 -c "import json; json.load(open('$CONFIG_FILE'))"
          # T742 产物层门禁（T734 病根：源码已修、产物照旧）。源码单测钉不住出包产物，这里钉。
          # ① mN→N 换算常量 MN_PER_N 在产物中必须零命中（命中即采集/校准腿仍带 ÷1000）。
          if MN_HITS=$(grep -rIn "MN_PER_N" "$DIST_DIR"); then
            echo "::error::[T742] ${{ matrix.app }} mp-weixin 产物命中 MN_PER_N（源码绿产物照旧）"
            echo "$MN_HITS" | cut -d: -f1,2 | head -20
            exit 1
          fi
          # ② /1e3 只允许落进以下显式白名单，禁无脑扩；每条豁免理由写死：
          #    api/provision.js          —— 配网凭据到期倒计时 (expiresAt-Date.now())/1e3，毫秒转秒
          #    common/vendor.js          —— 展示层唯一换算出口 nFromMn（Number.isFinite(e)?e/1e3:NaN）
          #    pages/wifi-config/index.js —— 技师端配网倒计时 (3e3-(now-start))/1e3、(Date.now()-start)/1e3，毫秒转秒
          #    pages/wifi-setup/index.js  —— 患者端配网倒计时 (Date.now()-start)/1e3、PROVISION_TIMEOUT_MS/1e3，毫秒转秒
          case "${{ matrix.app }}" in
            tech-miniapp)    ALLOW_1E3="api/provision.js common/vendor.js pages/wifi-config/index.js" ;;
            patient-miniapp) ALLOW_1E3="api/provision.js pages/wifi-setup/index.js" ;;
          esac
          BAD_1E3=$( { grep -rIn "/ *1e3" "$DIST_DIR" || true; } | while IFS=: read -r f ln _; do
            rel="${f#"$DIST_DIR"/}"
            case " $ALLOW_1E3 " in *" $rel "*) ;; *) printf '%s:%s\n' "$f" "$ln" ;; esac
          done)
          if [ -n "$BAD_1E3" ]; then
            echo "::error::[T742] ${{ matrix.app }} mp-weixin 产物出现非白名单 /1e3（只允许展示层 nFromMn 与毫秒计时）"
            echo "$BAD_1E3" | head -20
            exit 1
          fi
          echo "✓ ${{ matrix.app }} mp-weixin build artifacts verified"
