# BraceSync Release — main 合并后构建 7 服务镜像，TCR 凭据就绪则推送（T013 重写）
# 对齐：docs/ §6.3 · docs/ §1/§3.2/§7.2
# 职责：ci-go.yml/ci-fe.yml = PR 门禁；本 workflow = main 合并发布（构建 + 推送镜像）
#       **不含生产部署**——部署步骤见 runbook §3.1，由部署机执行（T013 红线：不碰生产服务器）
# TCR 凭据未就绪：TCR_READY 缺省/非 true 时跳过登录与推送（仅构建验证，不失败），启用见 runbook §7.2
name: Release

on:
  push:
    branches: [main]
    # 成本优化（T038）：仅服务代码/部署资产/CI 配置变更时触发；纯 docs 合并不重推镜像
    paths:
      - 'services/**'
      - 'scripts/deploy/**'
      - 'go.mod'
      - 'go.work'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}   # 手动触发（TCR 启用验证 / 补发）

# 成本优化（T045）：main 连续合并只保留最新一次 release 构建，取消旧的
concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: bracesync
  # secrets 不能直接用于 if/with 表达式（GitHub 限制），先映射到 env 再判断
  # TCR_READY 缺省或非 true → 跳过登录与推送（仅构建验证，不失败）
  TCR_READY: ${{ secrets.TCR_READY }}

jobs:
  build-and-push:
    name: Build & Push Images (7 services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - user-service
          - device-service
          - data-service
          - alert-service
          - file-service
          - msg-service
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR (skip if credentials not ready)
        if: env.TCR_READY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ env.TCR_READY == 'true' }}
          load: ${{ env.TCR_READY != 'true' }}
          # 成本优化（T038）：buildx GHA 缓存，7 服务共享依赖层，重编译大幅提速（cache 存储计入仓库免费 10GB）
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ matrix.service }}:${{ env.SHORT_SHA }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ matrix.service }}:latest
