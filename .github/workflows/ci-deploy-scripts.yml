# BraceSync 部署脚本静态检查（T364）
# 背景：scripts/deploy/** 不在任何 PR workflow 的 paths 里 —— 部署脚本文法错误要等下一次
#       现网跑批才暴露（且那时正好落在「① 步换掉正在解释的自身」这条隐患的窗口里）。
# 定位 = 最小语法级检查 + 自检脚本行为测试，与 ci-backup-scripts.yml 同一口径：
#   `bash -n` 失败即红；shellcheck 结论只作 PR 注释呈现，不做门禁（既有告警面广，先建可见性）。
#   T383 起追加两个行为测试步（都进门禁）：selfcheck-behavior-test.sh 验 record / verify /
#   receipt 三条路径的退出码（0 / 2 / 3 各自要对）与落盘内容；publish-cron-scripts-test.sh
#   验原子签发与「签不全就一份都不签」的两条红 —— 中止轮凭据这种「只在出事时才用到的东西」，
#   没有真跑一遍就等于没写（T364 那格假绿：守卫的放行分支从没被执行过）。
#   T393 再加两个测试步骤：部署链接线守卫（N1，把 deploy-staging.sh 的接线拆掉必判红）与
#   cron 引用零漂移守卫（N6，实际 crontab 与仓内期望落点做只读比对）。两类步骤各管一面：
#   前两个管「被签出去 / 被落盘的脚本自己行为对不对」，后两个管「收口还接不接在部署链上、
#   cron 有没有指回被部署工作树」。
#   T463 再加一步：部署起跑门行为测试（T460 撞车事故的机器化）—— 本步测「门判得对不对」，
#   门「接没接在部署链上、排在基线采集之前」由 N1 那一格的 W8/W9 管，两边合起来才算收口。
# 未在分支保护里设为 required check ⇒ 不阻塞合并。
name: Deploy Scripts Static Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/deploy/**'
      - '.github/workflows/ci-deploy-scripts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-scripts-static:
    name: bash -n + shellcheck (scripts/deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n 语法检查（失败即红）
        run: |
          rc=0
          shopt -s nullglob
          for f in scripts/deploy/*.sh; do
            if bash -n "$f" 2>/tmp/syn.err; then
              echo "OK    $f"
            else
              echo "::error file=$f::bash -n 语法检查失败"
              sed 's/^/        /' /tmp/syn.err
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "部署脚本存在语法错误，现网跑批必失败"
          fi
          exit $rc

      - name: 自检行为测试（T383 中止轮凭据 / record-verify-receipt 三向 rc）
        run: |
          # 检测类改动必须双向取证：既验「该放行」的放行，也验「该判红」的判红，
          # 还验 rc 既非 0 也非预期码那一条 —— 见 scripts/deploy/selfcheck-behavior-test.sh。
          bash scripts/deploy/selfcheck-behavior-test.sh

      - name: 外置签发行为测试（T383 cron 脚本原子签发 / 半途而废的两条红）
        run: |
          # 第一处的判据「cron 引用路径不再落在被部署工作树内」靠签发实现，
          # 而「宁可少签也不签一半」这条只有真跑一遍缺源的两条红才看得见 —— 见
          # scripts/deploy/publish-cron-scripts-test.sh（权限位 500 在 ubuntu 上是实测值，非跳过）。
          bash scripts/deploy/publish-cron-scripts-test.sh

      - name: 部署链接线守卫（T393 N1 deploy-staging.sh 的接线拆掉必判红）
        run: |
          # Joe T383 工程验收 N1：把 ⑦-b 调用删掉、把 EXIT trap 退回旧纯清理、把 ⓪ 段必需项检查删掉，
          # 上面两个行为测试与 bash -n 全都照样绿 —— 即「收口真的接在部署链上」这件事无人守。
          # 本步正向逐格要求在位 + 反证逐格拆一遍要求对应那格必判红（红格编号要对得上，
          # 顺带格也红就说明判读不纯），见 scripts/deploy/deploy-chain-wiring-test.sh。
          bash scripts/deploy/deploy-chain-wiring-test.sh

      - name: cron 引用零漂移守卫行为测试（T393 N6 期望外置落点 / 三条红 + 第三态）
        run: |
          # 仓里第一次有「两条 cron 应当指向哪里」的期望件，实际 crontab 由 ⓪-b 段只读比对。
          # 这里喂夹具表跑三向：现网真实形态判绿、指回工作树/少引用/副本不见各判一红、
          # 读不到与空表走 rc=3（「读不到」绝不许当「一致」），见 scripts/deploy/cron-reference-guard-test.sh。
          bash scripts/deploy/cron-reference-guard-test.sh

      - name: 部署起跑门行为测试（T463 e2e-real 撞车窗口机器门 / 放行-判红-读不到三态）
        run: |
          # T460 第十八轮实测撞车（最后一次读门 15:04:21、Iris 的 run 创建于 15:04:32、起跑 15:07:32）
          # ⇒ 起跑门从「人读的纪律」改成脚本查一次就拒。本步跑满三向：夹具四态、真 curl 腿（本地假 API
          # 服务，不发真实外网请求）、外加把过滤链逐格拆掉要求对应结论翻转 —— 见 scripts/deploy/e2e-gate-test.sh。
          # 接线（deploy-staging.sh 真调了这个门、且排在基线采集之前）不在本步，在「部署链接线守卫」那一格的 W8/W9。
          bash scripts/deploy/e2e-gate-test.sh

      - name: shellcheck（informational，结论作 PR 注释）
        run: |
          shopt -s nullglob
          files=(scripts/deploy/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::scripts/deploy 下无 .sh，跳过"
            exit 0
          fi
          shellcheck --version
          report=$(mktemp)
          shellcheck -f gcc "${files[@]}" >"$report" 2>&1 || true
          lines=$(mktemp)
          grep -E '^[^:]+:[0-9]+:[0-9]+: [a-z]+: ' "$report" >"$lines" || true
          total=$(wc -l < "$lines" | tr -d '[:space:]')
          errors=$(grep -c ': error: ' "$lines" || true)
          while IFS= read -r line; do
            # shellcheck -f gcc 一行五段：file:line:col: severity: message
            file=$(echo "$line" | cut -d: -f1)
            ln=$(echo "$line" | cut -d: -f2)
            sev=$(echo "$line" | cut -d: -f4 | tr -d '[:space:]')
            msg=$(echo "$line" | cut -d: -f5-)
            case "$sev" in
              error) echo "::error file=$file,line=$ln::shellcheck$msg" ;;
              warning) echo "::warning file=$file,line=$ln::shellcheck$msg" ;;
              *) echo "::notice file=$file,line=$ln::shellcheck$msg" ;;
            esac
          done < "$lines"
          echo "shellcheck 结论：共 ${total} 条（其中 error 级 ${errors}），本步骤不以其结果判定成败"
