# BraceSync E2E
# PR 门禁（informational，不阻塞合并）：患者端/技师端/后台 H5 Playwright e2e（e2e/ 基座，本地 webServer + mock）
# push main：同上三端 mock 用例再跑一次（T381 要求②：合并后的 main 必须有最小回归，
#   不能只信「各 PR 各自绿」）；打 staging 的 e2e-real-staging 不在 push 上跑
# 定时/手动：真实模式（e2e-real/）打 staging 全量回归 + 契约冒烟
# 对齐：docs/ §4 · docs/ §6.3
#
# ─── T324：真实模式门禁与「staging 部署顺序」解耦 ──────────────────────────────
# e2e-real 打的是【已部署在 staging 上的包】，而 PR 门禁打的是【本分支代码】——两者天然错位：
#   PR 里新写的行为断言，在本 PR 合并并部署之前对 staging 必假红 ⇒「要绿先部署 / 要部署先合并 /
#   要合并先绿」的死锁（T322 实测 3 failed / 29 passed 即此）。
# 解法不是放宽判据（禁 continue-on-error / `|| true`，那是 T304 要修的旧病），而是分两个阶段：
#   · PR 阶段：断言照旧，只有【已部署包确实还没有该行为】的那几条按 post-deploy 显式跳过，
#     跳过清单写进 job summary（e2e-real/report-post-deploy.mjs），reviewer 看得见「这几条没验」。
#   · 定时 / 手动阶段（E2E_POST_DEPLOY_STRICT=1）：此时 staging 本该已追平 main，仍缺标记就是
#     「合并了却从没在真环境验过」⇒ e2e-real/deploy-guard.ts 直接抛错判红。
#   ⇒ 新行为断言不会永久挂在跳过里：要么部署上来验绿，要么把漏部署这件事红给所有人看。
# 用例侧写法见 e2e-real/deploy-guard.ts 顶部注释；落位示例见 e2e-real/tests/09-doctor-accounts.spec.ts。
# ──────────────────────────────────────────────────────────────────────────────
#
# ─── T304：staging 地址与变量名口径 ───────────────────────────────────────────
# 唯一入口变量 = E2E_STAGING_URL（本文件 env 块定义，e2e-real 两个 config 只读它）。
#   T614 补一格：链 B/链 C 的 H5 源是另外两颗（E2E_TECH_H5_URL / E2E_PATIENT_H5_URL，同在本文件
#   env 块定义）—— 这两颗不跟着入口变量走，因为小程序 H5 产物把 API 基址在构建期写死，
#   页面只能从那个源打开（详见 e2e-real/h5-origin.ts 顶部注释）。换环境时三颗一起换。
#   历史遗留的 STAGING_URL / BASE_URL / E2E_BASE_URL 三种写法已废除，不留别名：
#     · BASE_URL 曾在此传给 mock 用例，且根 config 根本不读它 ⇒ 死变量，已删
#     · E2E_BASE_URL 曾同时被「mock 本地 dev server」和「真实模式」读取 ⇒ mock 侧改名
#       E2E_LOCAL_BASE_URL，真实侧并入 E2E_STAGING_URL
# 地址来源：staging 的 Nginx 公开入口 = 服务器 106.52.39.208 的 81 端口
#   （域名等价写法 http://hbksd.com.cn:81，见 scripts/wechat/lib-target.js）。
#   admin-web 挂在 /admin/ 下，API 走 /api/，由同一条 location 反代到 staging gateway。
# 🔴 只打测试环境（staging，或 T651 起的 tst 档）：生产是同一台机器的 80/443 与另一台 49.235.137.217，
#    本 workflow 任何 job 都不得指向它们（生产零操作红线，见 docs/tasks/TAPD-agent-规则.md；
#    这条红线在 T651 切档后一格没松 —— 地址门里那枚生产入口针是硬判红，见预检尺）。
# 本机调试：ssh -N -L 2080:127.0.0.1:81 ubuntu@106.52.39.208
#           再 E2E_STAGING_URL=http://localhost:2080 npx playwright test --config=e2e-real/playwright.real.config.ts
# ──────────────────────────────────────────────────────────────────────────────
#
# ─── T651：CI 侧 TARGET 门可切换 TST lane（双通道，Boss 2026-10-10 批 A 解锁）────────────
# 面名先说清楚，免得下一位把「CI 的 TST lane」当成「已经能跑」：
#   本卡交付的是【开关 + 三颗注入变量同源切档 + 两 lane 各自独立排队 + 目标面预检尺】，代码面完整；
#   而 TST 那枚基址 http://192.168.5.41:91 是【站内地址】（仓内在册口径 = apps/*/.env.tst 里那串），
#   本 workflow 全部 job 都跑在 GitHub 云上 ubuntu-latest（本仓 self-hosted runner 注册数 0，
#   2026-10-10 现读：GET /repos/ryanicer/BraceSync-code/actions/runners 的 total_count=0），
#   云上 runner 到不了那枚内网地址 ⇒ 云上手动触发 tst 档，预检尺的「可达门」会当场判红并点名 origin
#   （这正是它的作用：把「通道不通」与「用例回归」分成两枚读数，不烧 45 分钟 runner 分钟）。
#   要拿 TST 的真实读数，两条路选一条，都归值班席/PM 裁（本席不自选也不代跑）：
#     甲：给本仓接一枚可达 TST 的 self-hosted runner（或把 TST 经隧道/反代发布成云上可达的入口）
#     乙：在 LAN 内那台机器上按 runbook 跑（既有写法，T616 就是这么取到 87 颗分母的）：
#         E2E_TARGET=tst E2E_STAGING_URL=http://192.168.5.41:91 E2E_TECH_H5_URL=<同串> \
#         E2E_PATIENT_H5_URL=<同串> npx playwright test --config=./e2e-real/playwright.real.config.ts
#         跑前先过同一把尺：node scripts/ci/e2e-real-target-preflight.mjs（三格门 + 探针，零凭据）
# ──────────────────────────────────────────────────────────────────────────────
name: E2E

on:
  pull_request:
    branches: [main, develop]
    # 成本优化（T038）：仅前端代码/测试/CI 配置变更时跑 PR E2E；纯 docs/ 改动跳过
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'e2e/**'
      - 'e2e-real/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  # T381 要求②：main 分支补最小回归触发。合并前 PR 跑过的三端 mock 用例，合并后要在 main 上
  #   再跑一次 —— 否则多个 PR 各自绿、合起来的 main 从没被这套用例跑过（同族假绿：T358/T364/T374）。
  #   只放开【本地 webServer + mock】的三个 job；打 staging 的 e2e-real-staging 显式排除 push，
  #   它在 main push 上会对着「尚未追平 main 的 staging 包」判红，还会往 staging 写造数行。
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: "0 2 * * *"  # 每日 02:00 UTC（mock 巡检，不受 paths 限制）
    - cron: "0 12 * * *" # 每日 20:00 北京时间：真实模式打 staging（会写 T053 前缀造数行，避开白天人工测试窗口）
  workflow_dispatch:
    inputs:
      target:
        # T651：CI 侧 TARGET 门可切换 TST lane。缺省 staging ⇒ 手动触发不发这一格时行为逐字不变。
        # 取值域只有两枚；workflow 级 env 用「== 'tst'」这一枚判别做三元归一，任何其它值（含拼错的）
        # 都落回 staging，不会静默打到一个既非 staging 也非 TST 的第三地址。
        description: 目标环境（T651 双通道：staging 为缺省，tst 打仓内在册的 TST 基址）
        required: false
        default: staging
        type: choice
        options:
          - staging
          - tst

# 成本优化（T045）：同一 PR/分支并发 push 只保留最新一次，取消旧 run（巡检/手动不受限）
# T381：group 里加 event_name —— schedule 的 github.ref 也是 refs/heads/main，
#   不加的话 push main 触发的 run 会把同时段在跑的每日巡检取消掉（T373 实踩过同类挤占）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # T651（Boss 2026-10-10 批 A，解锁 2026-10-08 那句「TARGET 门不授权改」）：CI 侧目标开关。
  #   · E2E_TARGET 只作自曝与预检尺的入参，用例侧一律不读它 —— 换目标仍由下面三颗变量决定，
  #     这样「入口变量名」与其读者（e2e-real 的两个 config、tests/22、tests/24、h5-origin.ts）一枚没改，
  #     staging 档三颗取值与改造前逐字同值 ⇒ 现有 lane 行为零变更。
  #   · tst 档那三串不是新造的地址：逐字取自仓内在册的 apps/{patient,tech}-miniapp/.env.tst
  #     （VITE_API_BASE_URL，T617 笔 9b85cd6 入库），由 scripts/ci/e2e-real-target-preflight.mjs
  #     每次 run 现读该两枚文件并比对「同源门」，漂了就判红，不靠这份注释保鲜。
  #   🔴 E2E_STAGING_URL 这颗名字按 T304 口径是「e2e-real 的唯一入口变量」，tst 档下它装的是 TST 入口
  #   —— 名字不改（改它要连带动五处读者与判据，越出本卡边界），一致性由预检尺的三格门钉住。
  E2E_TARGET: ${{ github.event.inputs.target == 'tst' && 'tst' || 'staging' }}
  E2E_STAGING_URL: ${{ github.event.inputs.target == 'tst' && 'http://192.168.5.41:91' || 'http://106.52.39.208:81' }}
  # T614：链 B / 链 C 的 H5 源。两条 H5 腿不能跟着 E2E_STAGING_URL 走 —— 技师端/患者端产物把 API
  #   基址在构建期写死（apps/*/.env.staging 经 define 注入 __API_BASE_URL__，全仓无 CORS 放行），
  #   页面必须从那个源打开，否则应用自己的请求跨源被浏览器拦掉。此前这两颗只在用例里留了默认值、
  #   CI 侧没有注入位 ⇒ 换环境时无从显式指定（2026-10-07 真打 TST 的 4 条红就是这么来的）。
  #   口径：换目标环境时三颗一起换 —— T651 起这一「一起」由下面的 target 判别保证（三颗同源切档），
  #   只改第一颗而这两颗仍留 staging 那一形，由预检尺的同源门当场判红。
  E2E_TECH_H5_URL: ${{ github.event.inputs.target == 'tst' && 'http://192.168.5.41:91' || 'http://hbksd.com.cn:81' }}
  E2E_PATIENT_H5_URL: ${{ github.event.inputs.target == 'tst' && 'http://192.168.5.41:91' || 'http://hbksd.com.cn:81' }}

jobs:
  patient-miniapp-e2e:
    name: Patient MiniApp E2E (Playwright, H5)
    runs-on: ubuntu-latest
    # T381：PR + push main 都跑（mock 本地 webServer，不打 staging）。
    # T555 格三：这一句原来结尾写着「零外部写」，只当声明用；现在那一格变成可判的断言 ——
    #   下面步骤「Assert no external egress (T555 格二)」按 e2e/helpers.ts 落的网络层 JSONL 逐条判，
    #   非本机 origin 即判红。排查入口：先看该 run 里的 e2e-egress/patient.jsonl 有几行、origin 各是谁。
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check apps/patient-miniapp exists
        id: check
        run: |
          if [ -d "apps/patient-miniapp" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/patient-miniapp 尚未入库（T016 待合并），E2E 跳过（informational，不阻塞）"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.check.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      # dev server 由 playwright.config.ts 的 webServer 拉起（uni --port ${E2E_PORT:-5173}）
      - name: Run Playwright E2E
        if: steps.check.outputs.present == 'true'
        # E2E_EGRESS_LOG 是 e2e/helpers.ts:18 那根观测腿的落盘开关，不给就没有 JSONL 可断
        env:
          E2E_EGRESS_LOG: e2e-egress/patient.jsonl
        run: npx playwright test
      - name: Assert no external egress (T555 格二)
        if: steps.check.outputs.present == 'true'
        env:
          E2E_EGRESS_LOG: e2e-egress/patient.jsonl
        run: node e2e/assert-no-external-egress.mjs --log "$E2E_EGRESS_LOG"
      - name: Upload Playwright report
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure screenshots/traces
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14

  tech-miniapp-e2e:
    name: Tech MiniApp E2E (Playwright, H5)
    runs-on: ubuntu-latest
    # T381：PR + push main 都跑（mock 本地 webServer，不打 staging、零外部写）
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check apps/tech-miniapp exists
        id: check
        run: |
          if [ -d "apps/tech-miniapp" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/tech-miniapp 尚未入库（T018 待合并），E2E 跳过（informational，不阻塞）"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.check.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      # dev server 由 e2e/tech-playwright.config.ts 的 webServer 拉起（uni --port ${E2E_PORT:-5174}）
      - name: Run Playwright E2E (tech-miniapp)
        if: steps.check.outputs.present == 'true'
        run: npx playwright test --config=e2e/tech-playwright.config.ts
      - name: Upload Playwright report
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tech-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure screenshots/traces
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tech-test-results
          path: test-results/
          retention-days: 14

  admin-web-e2e:
    name: Admin Web E2E (Playwright, Vue3+ElementPlus)
    runs-on: ubuntu-latest
    # T381：PR + push main 都跑（mock 本地 webServer，不打 staging、零外部写）
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check apps/admin-web exists
        id: check
        run: |
          if [ -d "apps/admin-web" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/admin-web 尚未入库（T020 待合并），E2E 跳过（informational，不阻塞）"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.check.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      # dev server 由 e2e/admin-playwright.config.ts 的 webServer 拉起（vite --port ${E2E_PORT:-5175} --strictPort）
      - name: Run Playwright E2E (admin-web)
        if: steps.check.outputs.present == 'true'
        run: npx playwright test --config=e2e/admin-playwright.config.ts
      - name: Upload Playwright report
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure screenshots/traces
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-admin-test-results
          path: test-results/
          retention-days: 14

  playwright-e2e:
    name: Playwright E2E (mock，本地 webServer，不打 staging)
    runs-on: ubuntu-latest
    # T609 甲案：定时臂加 cron 字面量判别 —— 本 job 只认领 02:00Z 那档，12:00Z（打 staging 那档）不再放行它。
    if: (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # T304：原先这里注入 BASE_URL=${STAGING_URL}（占位域名），而根 playwright.config.ts 从不读
      # BASE_URL —— 用例跑在本地 webServer 上，该 env 是死变量且误导「staging 巡检」这个 job 名。
      - name: Run E2E tests
        run: npx playwright test --project=chromium
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-schedule-report
          path: playwright-report/
          retention-days: 14

  e2e-real-staging:
    # T651：job 标签一律不动（staging 档与 tst 档同一串，逐字等于改造前）。
    # 为什么不做成「标签跟着 target 走」：实测在 checks 面上，**被跳过**的 job 标签会留成未求值的
    # 表达式原文（PR 377 那一发的 `Real Backend Smoke` 是 skipped，标签面渲染出整串
    # `github.event.inputs.target == 'tst' && ...`），那是给别人的按标签取值的尺灌进去的新噪声。
    # 自曝面改放在两处实打实的读数里：下面「目标面预检」那步的逐枚 origin 打印（打的是解析后的值），
    # 以及同一步写进 `$GITHUB_STEP_SUMMARY` 的那行 target（同一份内容、两个读数面）。
    name: E2E Real（真实模式全量回归，打 staging）
    runs-on: ubuntu-latest
    # T381：本 job 过去没有 if（= 任何触发器都跑）。加了 push main 触发后必须显式排除 push：
    #   1) 它打的是【已部署的 staging 包】，push main 时包多半还没追平 main ⇒ post-deploy 判红是噪音；
    #   2) 它每 run 往 staging 写造数行（见下方清单），push 触发等于把写频次绑到合并次数；
    #   3) STRICT 口径（第 325 行 env）只认「非 pull_request」，push 会被误当成定时轮判红。
    # 真实模式回归的触发面保持：PR（改动命中 paths）+ 每日 12:00 UTC + 手动。
    # T582 格二（2026-10-06 书面裁定，执行人 joe）：上一句就是裁定本体 —— e2e-real 的触发面是三面
    #   （PR 命中 paths / schedule / 手动 dispatch），main push 面有意不跑，且「择一」里选的是书面裁定、
    #   不是补一条 main 上的最小回归路径。判据要求的那半「别处不缺覆盖」的实证（三面 paths 覆盖清单 +
    #   逐条执行行 + 两档清单集合差）已升格成可检索的流程条款：docs 仓 docs/tasks/_board/流程规范.md
    #   「真实模式（e2e-real）的触发面是三面不是四面」一节（2026-10-05 第 59 轮补裁，待 PM 复核）。
    # T609 甲案（duty 2026-10-08 17:18 裁定，执行腿 winner）：schedule 臂加 cron 字面量判别，本 job 只认领
    #   12:00Z 档；pull_request 与 workflow_dispatch 两臂原样不动。三面承诺不变，只是 schedule 那一面变窄。
    if: github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || github.event_name == 'workflow_dispatch'
    # T304：真实模式过去在 CI 里只有 tsc + --list，从未真跑过一条用例。
    # 现在 PR（改动命中 paths）+ 每日 20:00 北京时间 + 手动都真跑；失败即判红，
    # 不加 continue-on-error / `|| true`，以免又变成「CI 绿但真环境没人验」。
    #
    # 本 job 会在 staging 留下的写动作（逐条核过服务端代码，2026-09-22 现值实测）：
    #   · 1.3 / 1.6 两次「登录失败」请求：user-service login 只在成功时写审计留痕，
    #     失败分支直接 401 返回，无失败计数、无锁定策略 ⇒ 反复跑不会锁死 ops_admin
    #   · 每次登录写 1 条 audit_log「运营后台登录成功」（约 30 条/run；操作日志页按格式断言，不按条数）
    #   · 6.2 → 6.3 → 6.5 建一个 T053团队-xxx、改名、再把它删掉（只碰自己建的）
    #   · 8.2 PUT /admin/settings 把 maxPatients 加 1 再 PUT 回原值（finally 兜底还原）。
    #     T281（threshold_pressure_low 10→1）合并后 staging 现值 high=5 / low=1 已满足不变量，
    #     本条不再走「PUT 被拒即跳过」分支 ⇒ 每次 run 都会真写一次并还原
    #   · T462 S5 链 B（tests/23-chain-b-technician.spec.ts）：写动作 0 行。整条链只发 GET 与两条
    #     POST /api/v1/tech/login —— 假凭据那条必 401（user-service 失败分支无写、无锁定），
    #     真凭据那条成功也只签一个 JWT（handler.go:596-640 techLogin 判完即 return，不落库）⇒ 无脏数据可还原。
    #     该链缺 TECHE2E_TECH_ACCOUNT / TECHE2E_TECH_PASSWORD 时判红而不跳过，是设计意图（PM 2598 丙案），
    #     不是本文件漏配；不可逆的 B3（安装采集写入）/ B5（告警 process）本轮根本没接进 CI。
    # 不可逆的用例在代码里就 test.skip 掉了，CI 放开不了（要放开须 PM 裁定后删那行 skip）：
    #   3.4 处理真实告警、7.3 处理反馈（process 端点单向，且 feedbacks 无 DELETE 端点 ⇒ 自建也清不掉；
    #     T311 之后「后台无新建反馈端点」那句旧理由已不完整，口径订正见 07-communication.spec.ts 注释）、
    #     6.4 删 seed 团队；
    #   5.4/5.5 患者写用例（无 DELETE /admin/patients 端点，跑一次永久留一条脏数据）。
    # 预期计数：admin-web 新包（含 #175）部署到 staging 前 32 passed / 9 skipped / 0 failed；
    #   部署后自动变 36 passed / 5 skipped / 0 failed。
    #   其中 4 条 post-deploy skip 是 e2e-real/tests/04-monitor.spec.ts 的 4.1a / 4.1b / 4.1c / 4.2e：
    #   它们断的是 T322 新构建行为（采集/拉取双时刻、live-expired、live-none、校准后负读数按 0 展示），
    #   而本 job 打的是【已部署包】，合并+部署前旧包必假红（2026-09-22 23:56 实测 3 failed / 29 passed / 5 skipped）。
    #   PM 裁定「门禁口径以 T324 为准」⇒ 这四条不再自己写 skip，统一走 e2e-real/deploy-guard.ts：
    #   PR 阶段探测已部署包缺构建标记（.update-time 里有没有「数据采集：」）⇒ 显式 post-deploy 跳过，
    #   并汇总进 job summary（report-post-deploy.mjs）；标记在了就照旧真跑；定时/手动阶段
    #   （E2E_POST_DEPLOY_STRICT=1）仍缺标记 ⇒ 判红，新行为断言不许永久挂在跳过上。
    #   两个方向 2026-09-23 15:4x 本地实测过：打 staging 现网包 ⇒ 4 skipped / 7 passed；
    #   打本分支新构建（5189 代理同一 staging 后端）⇒ 10 passed 一条不跳。
    #   判据本身一条没放宽，也没加 continue-on-error。
    # T324 的另一条：09-doctor-accounts.spec.ts 的 9.1（T315 医护账号页）此前同样按 post-deploy 跳过，
    #   staging 于 2026-09-23 部署到含 T315 的构建后已转真跑（2026-09-23 本地实测 passed）。
    # 上面 9 条 / 5 条 skip 里，既有的那 5 条仍是不可逆写用例：3.4 / 5.4 / 5.5 / 6.4 / 7.3。
    #   其中 26 条只读用例已于 2026-09-22 18:00 本地真打 staging 实测通过（26 passed / 5 skipped / 0 failed，
    #   含 1.3/1.6 两次失败登录）；另 4 条是上面列到的真写用例 6.2 / 6.3 / 6.5 / 8.2，只在 CI 里跑。
    #   10.1（T334 中文写入字节面防回归）自建自删，每次 run 真跑。
    # T336 再加两条（01-login.spec.ts 的 1.7 深链回原页 / 1.8 子路由刷新）：标记 T336-admin-base-path。
    #   这两条判的是 staging 上「前端构建 base 是否已是 /admin/」，PR 阶段线上仍是 root-base 旧包 ⇒ post-deploy 跳过。
    #   实跑计数（本 PR run 35844912438，2026-09-23 17:53）：36 passed / 7 skipped / 0 failed，
    #   日志原文两行 `[post-deploy] skip T336-admin-base-path`；那 7 条 skip = 本卡 2 条 + 不可逆写用例 5 条
    #   （上面 #175 那 4 条监控守卫已转真跑 ⇒ 说明线上包已含 #175，242-243 行的 32/9 是当时的口径，现已不适用）。
    #   本卡构建部署上 staging 后两条自动转真跑 ⇒ 预期 38 passed / 5 skipped。
    #   部署前已用「本地构建产物 + 挂载点同语义仿真服务器（/api 反代真 staging）」实测 2 passed（两向反证都在交件说明）。
    #   ⇒ 本卡合并后必须走一次 staging 部署，否则下一次定时 run 会因缺标记判红（这是设计意图，不是误报）。
    # T353 再加三条（tests/11-patient-exists.spec.ts，全 GET 只读、不自建数据）：
    #   11.1 断的是 data-service T340 已上线口径 ⇒ 无守卫，每次 run 真跑。
    #   11.2 / 11.3 断的是本卡给 user-service / msg-service 补的「查无此人 404」，标记
    #   T353-user-patient-404 / T353-msg-patient-404（两条链路分开探，部署进度可以不同）。
    #   2026-09-24 01:1x–01:2x 本机打现网三向实测（不是推算）：
    #     · 常规阶段（E2E_POST_DEPLOY_STRICT 未置）⇒ 1 passed / 2 skipped，
    #       日志两行 `[post-deploy] skip T353-user-patient-404` / `... skip T353-msg-patient-404`；
    #       11.1 的 8 次请求逐条打了 `GET http://106.52.39.208:81/api/v1/patients/... -> HTTP 404 code=10404`
    #       / `-> HTTP 200 code=0`，可据此核对确实打了 staging 而非空地址。
    #     · 置 E2E_POST_DEPLOY_STRICT=1（定时/手动阶段）⇒ 2 failed，报「部署守卫判红」，行为未部署不会被静默放行。
    #     · 把两条 probe 临时改成恒 true（模拟「已部署」）⇒ 仍 2 failed，红的是断言本身而不是守卫：
    #       报 "不存在患者应 404 + 业务码 10404 + data:null，实际偏差：orthosis-plans HTTP=200；
    #       …；feeling-logs …；review-records …"（6 个端点逐条列全），证明跳过掩盖的不是空判据。
    #   ⇒ 本卡合并后同样必须走一次 staging 部署，否则定时 run 判红；部署后这 2 条自动转真跑（各 +1 passed）。
    #   本 PR CI 实跑（code PR #193，run 35896331022，2026-09-23 17:41 UTC）：**39 passed / 7 skipped / 0 failed**；
    #     那 7 条 skip = 5 条不可逆写用例（3.4 / 5.4 / 5.5 / 6.4 / 7.3）+ 本卡 2 条 post-deploy。
    #     对上 T336 那行的 38/5：本卡 +1 passed +2 skipped，且 T336 的 1.7/1.8 已因线上包已追平而转真跑。
    #     T353 部署上 staging 后预期 41 passed / 5 skipped。
    # T359 再加三条（tests/03-alerts.spec.ts 的 describe「03c-告警处理流程 · 医护可读」）：
    #   3c.3（ops_admin 进 Tab3 不退化）无守卫，每次 run 真跑。
    #   3c.1 / 3c.2 断的是本卡「模板读对 staff 放行」，标记 T359-flow-templates-staff-read（API 口径，
    #   只需网关 + user-service 新包）/ T359-process-tab-no-403（UI 口径，还要 admin-web 新包）
    #   ⇒ 两条分开探，部署进度可以不同。
    #   本 PR CI 实跑（code PR #197，两个 green run：35908163255 / job 107344338537 与
    #     35910903878 / job 107350177697）：都是 **44 passed / 0 failed**，skip 从 8 条变 9 条 ——
    #     多的那条是期间 main 新合入的 12.1（T355），与本卡无关。
    #     本卡在其中固定贡献 1 passed（3c.3 无守卫）+ 2 skipped，日志两行
    #     `[post-deploy] skip T359-flow-templates-staff-read` / `... skip T359-process-tab-no-403`。
    #     （余下 skip 属别的卡：5 条不可逆写用例 + T348 的 2.4；T353 那 2 条到这两个 run 已转真跑
    #     ⇒ 上面 T353 段末尾那两行的 39/7 与 41/5 是当时的口径，现已不适用。）
    #   ⇒ 本卡合并后必须走一次 staging 部署（网关 + user-service + admin-web 三件都要新包），
    #     否则定时 run 会因缺标记判红（设计意图，不是误报）；部署后本卡 2 条自动转真跑（各 +1 passed）。
    # job 级并发锁：顶部 workflow 级 concurrency 按 PR 分组，多个 PR 的真跑会同时打 staging。
    # 写用例里 8.2 是「读现值 → +1 → 写回读到的值」，两条 run 交错会把 maxPatients 留在别人的
    # baseline 上（值仍合法但再也回不去 seed）。故所有 run 串行排队，不取消在跑的旧 run。
    concurrency:
      # T651 §二.3：两 lane 各自独立排队 —— tst 档换一枚组名，不与 staging 的串行锁互斥；
      # staging 档（PR / 定时 / 手动缺省）组名逐字不变 ⇒ 「一次只跑一枚打 staging 的真跑」那条承诺一格没松。
      group: ${{ github.event.inputs.target == 'tst' && 'e2e-real-tst' || 'e2e-real-staging' }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 预检尺自证有牙（T651，合成入参、零网络、零写）
        # 判据有没有牙由这一发每 run 证明，不靠注释散文（十枚正反用例逐枚打判语数，见该脚本 --selftest）。
        run: node scripts/ci/e2e-real-target-preflight.mjs --selftest
      - name: 目标面预检（T651 双通道：地址门 + 同源门 + 可达门，只读 GET）
        # 排在 npm ci / 装浏览器之前：通道不通就当场判红并点名是哪一枚 origin，
        # 不把 runner 分钟烧在逐用例超时上。本步零凭据注入（值不落日志，口径同 T506）。
        run: node scripts/ci/e2e-real-target-preflight.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 守时自记（T609 乙案，实测迟到分钟数进 job summary）
        # 只读 API、只写 summary：不碰 cron / concurrency / schedule / workflow_dispatch，不打 staging。
        # 名义触发时刻 GitHub 不给，只能由 github.event.schedule 的「分 时」两格推；形不支持就明写不判。
        # PR 触发时本步照跑但判语是 NOT_SCHEDULE_EVENT —— 留的是「run 内取数通路跑通」这一格，
        # 定时档的真读数要等下一次 schedule 真触发才出得来（本卡交付面 3 的三档实测窗）。
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/e2e-real-lateness-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Type check e2e-real
        run: npx tsc --noEmit --project e2e-real/tsconfig.json
      - name: Run e2e-real against staging
        # 用例先打一行 [e2e-real][login] GET <staging>/api/... 的请求日志，
        # 便于在 run 日志里核对「确实打了 staging」而不是打了空地址。
        # T324：PR 阶段（本分支的构建必然还没上 staging）允许 post-deploy 显式跳过；
        # 定时 / 手动阶段置 E2E_POST_DEPLOY_STRICT=1，那时仍缺标记即判红（e2e-real/deploy-guard.ts）。
        env:
          E2E_POST_DEPLOY_STRICT: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          # T462 S5 链 B（技师端登录腿）：凭据只从这两个变量进用例，值不落卡、不落板、不落仓文件。
          # 缺任一值时 23.1/23.2/23.3 判红而不是 skip（PM 2598 丙案）——静默跳过的绿不是证据。
          TECHE2E_TECH_ACCOUNT: ${{ secrets.TECHE2E_TECH_ACCOUNT }}
          TECHE2E_TECH_PASSWORD: ${{ secrets.TECHE2E_TECH_PASSWORD }}
          # T506（e2e-real 凭据接线）：真实模式口令只从 secrets 进用例，堵源码常量兜底假绿点（T509 实锤）。
          # 缺值时凭据门按设计抛错判红，静默兜底的绿不算证据（与 361 行同口径）。
          E2E_REAL_PASSWORD: ${{ secrets.E2E_REAL_PASSWORD }}
        run: npx playwright test --config=./e2e-real/playwright.real.config.ts
      - name: Summarise post-deploy skips（T324 门禁阶段结论，进 job summary）
        # if: always() —— 判红的 run 也要能看到「红在哪几条、缺哪个构建标记」，否则又要人重跑一遍去猜
        if: always()
        run: node e2e-real/report-post-deploy.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-staging-report
          path: |
            e2e-real/playwright-report/
            e2e-real/test-results/
          retention-days: 14

  # T381：本 job 长期是「两句 echo 的恒绿占位」。CI runner 上没有微信开发者工具
  #   （miniprogram-automator 必须连运行中的 devtools 自动化端口），补不成真断言，
  #   按卡片口径改走「改名 + 显式自曝」，四件齐由 scripts/ci/workflow-placeholder-audit.mjs 守着：
  #   placeholder-ok 注释 + job 名含「占位」+ ::warning:: + 写 job summary。
  #   真实小程序冒烟的验收权在 Boss 侧 devtools 实跑（e2e-miniapp/run-real-e2e.ps1）。
  # placeholder-ok: CI 无 devtools 环境，实跑需 Boss 侧 Windows + 微信开发者工具自动化端口
  miniapp-smoke:
    name: 小程序冒烟（占位，未实跑；miniprogram-automator 需 devtools）
    runs-on: ubuntu-latest
    # T609 甲案：占位 job 随两枚真实 job 归 12:00Z 档（承接笔 4491 第三节第 4 条的倾向，duty 未单列；要归 02:00Z 请回一句即改）。
    if: (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: 自曝：本 job 未执行任何断言
        run: |
          echo "::warning::「小程序冒烟」是占位 job，零断言零用例，绿色不代表小程序冒烟通过。真实执行在 Boss 侧 devtools（e2e-miniapp/run-real-e2e.ps1）。"
          {
            echo "## 小程序冒烟：占位未实跑"
            echo ""
            echo "- 本 job 执行的断言数：0（miniprogram-automator 需运行中的微信开发者工具自动化端口，ubuntu runner 上没有）"
            echo "- 真实冒烟验收通道：Boss 侧 Windows 实跑 e2e-miniapp/run-real-e2e.ps1"
            echo "- 本仓 e2e-miniapp/ 用例的语法门禁在 ci-miniapp-real-e2e.yml（PR 触发）"
          } >> "$GITHUB_STEP_SUMMARY"
          # 不再 npm ci / 装 playwright —— 占位 job 不占用 runner 分钟

  # T144 P1：真实后端冒烟（登录→列表接口非空→页面渲染≥1条）。
  # 不进 PR 门禁（独立 job）；nightly / 手动触发。凭证由 ADMIN_USERNAME/ADMIN_PASSWORD/E2E_REAL_PASSWORD 注入。
  # T304 实况：当时本仓 Actions secrets 为空 ⇒ 这条 nightly 恒定「0 通过 / 1 skip」，
  # 它证明不了真实后端（真正打 staging 的是上面的 e2e-real-staging）。补一行 warning 把
  # 「skip ≠ 验过」写进日志，避免又有人拿它的绿当联调证据；要不要配凭证由 PM 定。
  # T549 把用例侧的静默 skip 改成缺凭证判红（contract-smoke.spec.ts 的凭据门与地址门），
  # 但「进程 rc=0 而 0 执行 / 全 skip」那一形当时只有一把没接线的尺在管
  # （e2e-real/assert-smoke-executed.mjs 在场、tracked 文件引用 0 颗）⇒ 第 73 轮接进本 job。
  real-backend-smoke:
    # T651：标签同 e2e-real-staging 那一格 —— 不动（含 tst 档也用原串），理由与自曝面见上面那格注释。
    name: Real Backend Smoke（真实后端冒烟，T144 P1）
    runs-on: ubuntu-latest
    # T609 甲案：本 job 打 staging，定时臂只认领 12:00Z 档（02:00Z 那档不得再放行它）。
    if: (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: 目标面预检（T651 双通道，只读 GET）
        # 本 job 同样只读 E2E_STAGING_URL 那一颗入口变量 ⇒ 切档时它必须跟着切，
        # 否则「tst 档手动 run」里这一枚会静默打 staging（T614 那条「只换一半」的旧病换了个 job 复现）。
        # 牙的自证不在这里重复跑，挂在上面那枚真跑全量回归的 job 上。
        run: node scripts/ci/e2e-real-target-preflight.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Note missing credentials
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # 与 e2e-real-staging job（本文件 366 行）同一把凭据注入名：spec 里 ADMIN_PASSWORD
          # 缺失时经 realPassword 读它。本 job 过去不注入这颗，等于两级里只有一级能生效。
          E2E_REAL_PASSWORD: ${{ secrets.E2E_REAL_PASSWORD }}
        run: |
          if [ -z "$ADMIN_USERNAME" ] || { [ -z "$ADMIN_PASSWORD" ] && [ -z "$E2E_REAL_PASSWORD" ]; }; then
            echo "::warning::ADMIN_USERNAME 缺失，或 ADMIN_PASSWORD 与 E2E_REAL_PASSWORD 均缺失 —— 按 T549 口径下一步会判红而不是 skip（缺凭证不许再靠静默跳过保绿，T304 那句旧文案已订正）"
          fi
      - name: Run real backend smoke
        run: npx playwright test --config=./e2e-real/playwright.config.ts
        env:
          E2E_STAGING_URL: ${{ env.E2E_STAGING_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          E2E_REAL_PASSWORD: ${{ secrets.E2E_REAL_PASSWORD }}
      - name: Assert smoke really executed（T549 遗留一接线）
        # json reporter 只在整跑结束后落盘 ⇒ 本步排在 playwright 那一步之后且不加 if: always()，
        # 判据取自报告 stats：skipped 必须为 0，且 passed+flaky >= 1。
        # 钉的是「job success 但一条用例没跑」这一形：尺本体早在（e2e-real/assert-smoke-executed.mjs），
        # 是没人喂它 —— Joe 的四发注入证它有牙，本席第 73 轮在本机把八腿（缺报告 / 全 0 / skip /
        # 缺 stats 键 / 真绿 / 两把候选路径各一面）复跑一遍，逐腿带 rc 与首行，bad=0。
        # 报告落盘面本机实测在 configDir 相对那一面（e2e-real/test-results/smoke-result.json），
        # 尺本身两把候选都试并打印真正读到的那条，路径没对准不会静默放行。
        run: node e2e-real/assert-smoke-executed.mjs
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-report
          path: e2e-real/playwright-report/
          retention-days: 14

  # T609 甲案的守卫腿（duty 2026-10-08 17:18 裁定第四节：硬条件，不是建议）。
  # 为什么是一枚独立 job 而不是塞进上面某枚 job 的第一步：四枚 if 现在逐字比较 cron 串，
  #   将来谁把两档合并（如 "0 2,14 * * *"）或改了空格数，比较静默不命中 ⇒「该跑的没跑」而不是报错，
  #   而守卫步若挂在那些 job 里，job 被 skip 时守卫步一起不跑 ⇒ 报警面为零。
  #   本 job 的 if 只判事件名不含 cron 字面量，所以任何定时事件它都出场，能把原值打进步面摘要并自曝名册不符。
  # 零写动作：不 checkout、不 npm ci、不打 staging，只读 github 上下文并写 $GITHUB_STEP_SUMMARY。
  cron-attribution-guard:
    name: Cron 归属守卫（T609 只读，零 staging 动作）
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Print event attribution and check cron roster
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          SCHED="$GH_EVENT_SCHEDULE"
          [ -z "$SCHED" ] && SCHED="(non-schedule-event, no such key)"
          {
            echo "## T609 cron 归属守卫（只读）"
            echo ""
            echo "- github.event_name：$GH_EVENT_NAME"
            echo "- github.event.schedule：$SCHED"
            echo "- 名册：02:00Z 档 \"0 2 * * *\" 归 playwright-e2e；12:00Z 档 \"0 12 * * *\" 归 e2e-real-staging / miniapp-smoke / real-backend-smoke"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GH_EVENT_NAME" = "schedule" ]; then
            case "$SCHED" in
              "0 2 * * *"|"0 12 * * *")
                echo "GUARD_MATCH cron=$SCHED"
                ;;
              *)
                echo "::warning::T609 守卫不命中：定时事件收到的 cron 原值是 [$SCHED]，不在名册两枚字面量之内 —— 若主册 schedule 段被合并档或改了空格数，打 staging 的 job 会静默不跑（该跑的没跑）。请核对 e2e.yml 的 schedule 段与四枚 job 级 if。"
                echo "GUARD_MISMATCH cron=$SCHED"
                ;;
            esac
          else
            echo "GUARD_NOT_SCHEDULE event_name=$GH_EVENT_NAME"
          fi
