# BraceSync 生产/Staging 部署 Compose
# 对齐：docs/deployment/runbook.md §1 · docs/architecture/tech-architecture.md §6.1
# 用法：docker compose up -d（生产）/ docker compose -p staging up -d（staging）

services:
  nginx:
    image: nginx:1.25-alpine   # imageid sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /opt/bracesync/apps/admin-web/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  gateway:
    image: bracesync/gateway:5bd4ab3   # imageid sha256:a918013411e05d5560054c6c9a072578b4c82533f8bf466a388d5a992b75600c
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - ALERT_SERVICE_URL=http://alert-service:8080
      - USER_SERVICE_URL=http://user-service:8081
      - DEVICE_SERVICE_URL=http://device-service:8082
      - DATA_SERVICE_URL=http://data-service:8083
      - MSG_SERVICE_URL=http://msg-service:8086
      - FILE_SERVICE_URL=http://file-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  user-service:
    image: bracesync/user-service:5bd4ab3   # imageid sha256:43eba9951577bfe4434e7f36d7a1caccb857ddca7cc970c48ac79106b39a2c81
    environment:
      - PORT=8081
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PHONE_ENC_KEY=${PHONE_ENC_KEY}
      # T069：患者端微信登录凭据（缺失则 /patient/wx-login 降级 500，不影响其他端点）
      - WX_APPID=${WX_APPID}
      - WX_APP_SECRET=${WX_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  device-service:
    image: bracesync/device-service:63fc466   # imageid sha256:b2033ca432488bb22cbe11ff4bbbfa2fb3acd1e24b5ac8dd4ff69f70cf90c008
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - DEVICE_SECRET_ENC_KEY=${DEVICE_SECRET_ENC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  data-service:
    image: bracesync/data-service:61b2970   # imageid sha256:d2998dc6e3aa604eef065bfae632fed0b0a0a8a069304ded926a418d0ab90dba
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - ALERT_SERVICE_URL=http://alert-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  alert-service:
    image: bracesync/alert-service:acead6e   # imageid sha256:d877fb08371236e531c6f2c3f4d478436a0bad0c3f5edc703572e886becb65c9
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  msg-service:
    image: bracesync/msg-service:63fc466   # imageid sha256:061fa7da7bb0f92148b682c7d32944acab0e1076b60d32334d632ca41cd1b11f
    environment:
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  file-service:
    image: bracesync/file-service:5bd4ab3   # imageid sha256:d31df28503e08fc1a6f45df2f48f1ddcd5e2c7ff3b277b3c0638286757dd59bc
    environment:
      - PORT=8085
      - DB_URL=${DB_URL}
      - COS_SECRET_ID=${COS_SECRET_ID}
      - COS_SECRET_KEY=${COS_SECRET_KEY}
      - COS_BUCKET=${COS_BUCKET}
      - COS_REGION=${COS_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:15-alpine   # imageid sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      - POSTGRES_DB=bracesync
      - POSTGRES_USER=${POSTGRES_USER:-bracesync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bracesync}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine   # imageid sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.51.0   # imageid sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.0   # imageid sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:v1.7.0   # imageid sha256:4cb2b9019f1757be8482419002cb7afe028fdba35d47958829e4cfeaf6246d80
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
