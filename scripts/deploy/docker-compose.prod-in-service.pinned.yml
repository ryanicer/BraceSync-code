# T490 Q4 尾格记录件：生产在役 compose 副本 + 13 个服务的镜像 TAG 与 image ID 钉值
#
# 身份：本文件是「生产当前在役状态」的记录件，不是部署通道。
#   - 部署脚本只认 scripts/deploy/docker-compose.yml（deploy-staging.sh 第 237 行按全名取），本文件不参与任何部署，
#     deploy-staging.sh 与生产 /opt/bracesync 本笔一行未动。
#   - 合入本文件会让 Release workflow 在 main 上跑一次构建（release.yml 的 paths 含 scripts/deploy/**），
#     该 job 的 concurrency 是 release-main 且 cancel-in-progress，合并前请先看有没有在跑的 Release run。
#
# 读数出处（全部只读动作，writes_performed=NONE）：
#   - 在役 compose 文本：生产宿主机上那份文件的副本，取自证据包 docs 仓
#     docs/tasks/andy/T490-evidence-q1q4/compose/docker-compose.in-service.after-q3.yml（Q3 于 13:30:35 把
#     file-service 的 restart 改回 unless-stopped 之后的那一版）。
#   - TAG 与 image ID：docker inspect 只读回显（13 个容器，按 label com.docker.compose.project=bracesync
#     取生产那 13 个并显式排除 -staging- 命名的 13 个；宿主上 bracesync 前缀容器共 26 个）。
#     采集时刻 2026-10-01 16:10:13（北京时间），读数锚点见下方 Q0 行。
#
# digest 面的一条诚实说明（别把这里当 registry digest）：
#   宿主 docker image inspect 回显的 RepoDigests 与 image ID 逐字相同——自研镜像如此，连从公网 pull 来的
#   nginx:1.25-alpine 也同形（对照读数见包内 raw/26 的 Q2b 行）。正常 registry manifest digest 不会等于
#   config digest，所以这份 RepoDigests 不是独立的镜像仓库摘要，本件只用 image ID 作内容寻址钉值。
#   要真正的 registry digest，得等镜像被推到带摘要的仓库之后再补一次读数。
#
# 钉值表（service / 在役 TAG / image ID，与下面每行 image: 后的行内注释同源生成）：
