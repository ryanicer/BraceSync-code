#   alert-service  bracesync/alert-service:acead6e   sha256:d877fb08371236e531c6f2c3f4d478436a0bad0c3f5edc703572e886becb65c9
#   msg-service    bracesync/msg-service:63fc466     sha256:061fa7da7bb0f92148b682c7d32944acab0e1076b60d32334d632ca41cd1b11f
#   file-service   bracesync/file-service:5bd4ab3    sha256:d31df28503e08fc1a6f45df2f48f1ddcd5e2c7ff3b277b3c0638286757dd59bc
#   postgres       postgres:15-alpine                sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
#   redis          redis:7-alpine                    sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
#   prometheus     prom/prometheus:v2.51.0           sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
