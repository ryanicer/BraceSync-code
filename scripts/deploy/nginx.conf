# BraceSync nginx — HTTP 反向代理 + 静态资源托管
# 对齐：docs/ §1/§2
# 用法：docker compose up -d（生产）/ docker compose -p staging up -d（staging）

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── 日志（json-file rotation 由 compose logging 配置接管）─────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── 基础优化 ────────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;       # 文件上传（对齐 runbook COS 直传兜底）

    # T320：容器内固定 listen 80/443，宿主机把 staging 发布在 81 端口。nginx 默认
    # absolute_redirect on，会把下面的 return 302 /admin/ 展成 http://<host>/admin/，
    # 端口取容器内的 80（HTTP 默认端口，故被省略）⇒ 访问 staging 根地址落到宿主机
    # 80 端口上的 prod。改为相对引用后浏览器按当前 origin（含 :81）解析；
    # prod 走默认端口，行为不变。
    absolute_redirect off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ─── 上游集群 ────────────────────────────────────────────────────────
    upstream gateway {
        server gateway:8080;
    }

    # ─── HTTP (80) — api.hbksd.com.cn 301 跳转 HTTPS ─────────────────────
    server {
        listen 80;
        server_name api.hbksd.com.cn;
        return 301 https://$host$request_uri;
    }

    # ─── HTTP (80) ───────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        # server_name 留空——本期无域名，IP 直接访问（证书后补时填入域名）

        # ─ 静态资源：admin-web（staging: dist-staging / production: dist）
        #   T497 方案三（T510 实施）：入口页与 SPA fallback 每次回源校验（no-cache），
        #   内容哈希资源走强缓存。缺了 no-cache 那一半，换一代产物后浏览器还会拿旧
        #   index.html 去引已被 --delete 清掉的旧 chunk——那正是「首登慢」的放大器。
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache";
        }

        # T497：原先这条长缓存挂在 location /assets/ 上，而 admin-web 的构建 base 是
        # /admin/（apps/admin-web/src/utils/mount.ts 的 ADMIN_BASE），产物真实路径是
        # /admin/assets/...，由上面那条 /admin/ 服务 ⇒ 那条规则一次都没命中过。
        # 只留 add_header、不叠 expires：expires 自己会再发一个 Cache-Control，两条同名头
        # 让读数歧义（缓存到底多久，取哪一条？），max-age=31536000 一条说了算。
        location /admin/assets/ {
            alias /usr/share/nginx/html/admin/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ─ T427：两小程序 H5 走查站（uni-app h5 构建，router.mode=hash）。
        #   挂载点须与 apps/*-miniapp/src/manifest.json 的 h5.router.base 同值，
        #   由 apps/*/test|h5/ 下的挂载契约用例守住。仅 staging 出包，prod 侧目录为空 ⇒ 该两条 404。
        location /patient-h5/ {
            alias /usr/share/nginx/html/patient-h5/;
            index index.html;
            try_files $uri $uri/ /patient-h5/index.html;
        }

        location /tech-h5/ {
            alias /usr/share/nginx/html/tech-h5/;
            index index.html;
            try_files $uri $uri/ /tech-h5/index.html;
        }

        # ─ API 反代 → gateway:8080
        # T709/T708：运维反馈代理 service 反代（iframe 同源前缀路径；剥 /feedback-proxy/ 前缀转发，
        # 页内 fetch 走相对路径 ⇒ /feedback-proxy/api/feedback → service /api/feedback）
        location = /feedback-proxy {
            return 301 /feedback-proxy/;
        }
        location /feedback-proxy/ {
            proxy_pass http://feedback-proxy:8087/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ─ 健康检查直达 gateway
        location /healthz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # ─ 默认 → admin-web 首页
        location / {
            return 302 /admin/;
        }
    }

    # ─── HTTPS (443) — api.hbksd.com.cn ──────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.hbksd.com.cn;

        ssl_certificate     /etc/nginx/certs/api.hbksd.com.cn/api.hbksd.com.cn_nginx/api.hbksd.com.cn_bundle.crt;
        ssl_certificate_key /etc/nginx/certs/api.hbksd.com.cn/api.hbksd.com.cn_nginx/api.hbksd.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ─ 静态资源（T497 方案三，与 80 侧同规格：入口 no-cache + 哈希资源强缓存）
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache";
        }

        location /admin/assets/ {
            alias /usr/share/nginx/html/admin/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ─ T427：两小程序 H5 走查站（与 80 侧同挂载点，见上）
        location /patient-h5/ {
            alias /usr/share/nginx/html/patient-h5/;
            index index.html;
            try_files $uri $uri/ /patient-h5/index.html;
        }

        location /tech-h5/ {
            alias /usr/share/nginx/html/tech-h5/;
            index index.html;
            try_files $uri $uri/ /tech-h5/index.html;
        }

        # ─ API 反代 → gateway:8080
        # T709/T708：运维反馈代理 service 反代（iframe 同源前缀路径；剥 /feedback-proxy/ 前缀转发，
        # 页内 fetch 走相对路径 ⇒ /feedback-proxy/api/feedback → service /api/feedback）
        location = /feedback-proxy {
            return 301 /feedback-proxy/;
        }
        location /feedback-proxy/ {
            proxy_pass http://feedback-proxy:8087/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # ─ 健康检查直达 gateway
        location /healthz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # ─ /stg/ → staging 反代（2026-10-20 Boss 批：小程序体验版须走 443 合规域名，
        #     https://api.hbksd.com.cn/stg/<path> → http://172.17.0.1:81/<path>，剥 /stg/ 前缀。
        #     上游=同机 staging nginx（宿主 :81）；docker0 网关 172.17.0.1 实测 200/15B，
        #     172.19.0.1/172.18.0.1/172.16.0.3 亦通，取 docker0（compose 重建网络不变）。
        #     🔴 Host 必须写 hbksd.com.cn：传 $host(=api.hbksd.com.cn) 会命中 staging conf 第 38-40 行
        #     「listen 80 + server_name api.hbksd.com.cn ⇒ return 301 https://$host$request_uri」，
        #     被它打回 prod 自身（301 Location: https://api.hbksd.com.cn/healthz）；hbksd.com.cn 不匹配
        #     staging 任何 server_name ⇒ 落 default_server 直服务（实测 200/15B）。
        #     proxy_redirect off：不让 nginx 改写上游 Location，重定向原样可甄别。）
        location /stg/ {
            proxy_pass http://172.17.0.1:81/;
            proxy_http_version 1.1;
            proxy_set_header Host hbksd.com.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }

        # ─ 默认 → admin-web 首页
        location / {
            return 302 /admin/;
        }
    }

    # ─── 裸域 HTTPS (443) — server_name hbksd.com.cn：本块按 T723 裁定不入本模板。
    #     理由：本模板 prod 与 staging 共用（deploy 把同一份 cp 进 staging 目录），而 staging
    #     没有 /etc/nginx/certs/hbksd.com.cn/ 证书束，块留在模板里下次 staging 起不来。
    #     原文与落位：docs/ops/prod-nginx-bare-domain.conf —— prod 重建时手工粘在本文件
    #     api 443 server 块之后、http{} 闭合之前；staging 不放置。
}
