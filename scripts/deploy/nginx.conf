# BraceSync nginx — HTTP 反向代理 + 静态资源托管
# 对齐：docs/ §1/§2
# 用法：docker compose up -d（生产）/ docker compose -p staging up -d（staging）

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── 日志（json-file rotation 由 compose logging 配置接管）─────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── 基础优化 ────────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;       # 文件上传（对齐 runbook COS 直传兜底）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ─── 上游集群 ────────────────────────────────────────────────────────
    upstream gateway {
        server gateway:8080;
    }

    # ─── HTTP (80) — api.hbksd.com.cn 301 跳转 HTTPS ─────────────────────
    server {
        listen 80;
        server_name api.hbksd.com.cn;
        return 301 https://$host$request_uri;
    }

    # ─── HTTP (80) ───────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        # server_name 留空——本期无域名，IP 直接访问（证书后补时填入域名）

        # ─ 静态资源：admin-web（staging: dist-staging / production: dist）
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /assets/ {
            root /usr/share/nginx/html/admin;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─ API 反代 → gateway:8080
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ─ 健康检查直达 gateway
        location /healthz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # ─ 默认 → admin-web 首页
        location / {
            return 302 /admin/;
        }
    }

    # ─── HTTPS (443) — api.hbksd.com.cn ──────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.hbksd.com.cn;

        ssl_certificate     /etc/nginx/certs/api.hbksd.com.cn/api.hbksd.com.cn_nginx/api.hbksd.com.cn_bundle.crt;
        ssl_certificate_key /etc/nginx/certs/api.hbksd.com.cn/api.hbksd.com.cn_nginx/api.hbksd.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ─ 静态资源
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /assets/ {
            root /usr/share/nginx/html/admin;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─ API 反代 → gateway:8080
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # ─ 健康检查直达 gateway
        location /healthz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # ─ 默认 → admin-web 首页
        location / {
            return 302 /admin/;
        }
    }
}
